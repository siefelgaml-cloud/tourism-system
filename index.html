<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام البحث والتصفية</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Cairo) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6">
    
    <!-- قسم مدخلات البحث (الفلترة) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      
      <!-- اسم المورد / الجهة -->
      <div class="flex flex-col">
        <label for="supplier" class="text-sm font-semibold text-gray-700 mb-2 text-right">
          اسم المورد / الجهة:
        </label>
        <input 
          type="text" 
          id="supplier" 
          placeholder="اسم المورد..." 
          class="border border-gray-300 rounded-md px-3 py-2 text-right focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700"
        >
      </div>

      <!-- رقم الملف (File Code) -->
      <div class="flex flex-col">
        <label for="fileCode" class="text-sm font-semibold text-gray-700 mb-2 text-right">
          رقم الملف (File Code):
        </label>
        <input 
          type="text" 
          id="fileCode" 
          placeholder="رقم الملف..." 
          class="border border-gray-300 rounded-md px-3 py-2 text-right focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700"
        >
      </div>

      <!-- العملة -->
      <div class="flex flex-col">
        <label for="currency" class="text-sm font-semibold text-gray-700 mb-2 text-right">
          العملة:
        </label>
        <select 
          id="currency" 
          class="border border-gray-300 rounded-md px-3 py-2 text-right focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 bg-white"
        >
          <option value="">جميع العملات</option>
          <option value="EGP">EGP - جنيه مصري</option>
          <option value="USD">USD - دولار أمريكي</option>
          <option value="EUR">EUR - يورو</option>
          <option value="SAR">SAR - ريال سعودي</option>
        </select>
      </div>

    </div>

    <!-- أزرار التحكم -->
    <div class="flex justify-end gap-3 border-b pb-6 mb-6">
      <button 
        onclick="performSearch()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-md transition duration-200"
      >
        بحث
      </button>
      <button 
        onclick="resetSearch()" 
        class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-6 py-2 rounded-md transition duration-200"
      >
        إعادة ضبط
      </button>
    </div>

    <!-- قسم عرض النتائج (مخفي افتراضياً) -->
    <div id="resultsContainer" class="hidden">
      <h3 class="text-lg font-bold text-gray-800 mb-4 text-right">نتائج البحث:</h3>
      
      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse border border-gray-200">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-sm">
              <th class="p-3 border border-gray-200">#</th>
              <th class="p-3 border border-gray-200">اسم المورد / الجهة</th>
              <th class="p-3 border border-gray-200">رقم الملف (File Code)</th>
              <th class="p-3 border border-gray-200">العملة</th>
              <th class="p-3 border border-gray-200">المبلغ</th>
              <th class="p-3 border border-gray-200">الحالة</th>
            </tr>
          </thead>
          <tbody id="resultsTableBody" class="text-sm text-gray-600">
            <!-- يتم تعبئة البيانات هنا ديناميكياً -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- رسالة عدم وجود نتائج -->
    <div id="noResults" class="hidden text-center py-8 text-gray-500">
      لا توجد نتائج تطابق معايير البحث المدخلة.
    </div>

  </div>

  <script>
    // بيانات تجريبية لمحاكاة قاعدة البيانات
    const mockData = [
      { id: 1, supplier: "شركة الأمل للتوريدات", fileCode: "FC-101", currency: "EGP", amount: "150,000", status: "مكتمل" },
      { id: 2, supplier: "مؤسسة الخليج للتجارة", fileCode: "FC-102", currency: "USD", amount: "12,500", status: "قيد المعالجة" },
      { id: 3, supplier: "شركة النور للمقاولات", fileCode: "FC-103", currency: "EUR", amount: "8,400", status: "معلق" },
      { id: 4, supplier: "مكتب الشرق للاستشارات", fileCode: "FC-104", currency: "EGP", amount: "45,000", status: "مكتمل" },
      { id: 5, supplier: "شركة الأمل للتوريدات", fileCode: "FC-105", currency: "SAR", amount: "30,000", status: "قيد المعالجة" }
    ];

    function performSearch() {
      // جلب قيم المدخلات
      const supplierInput = document.getElementById('supplier').value.trim().toLowerCase();
      const fileCodeInput = document.getElementById('fileCode').value.trim().toLowerCase();
      const currencyInput = document.getElementById('currency').value;

      // تصفية البيانات
      const filteredResults = mockData.filter(item => {
        const matchesSupplier = item.supplier.toLowerCase().includes(supplierInput);
        const matchesFileCode = item.fileCode.toLowerCase().includes(fileCodeInput);
        const matchesCurrency = currencyInput === "" || item.currency === currencyInput;

        return matchesSupplier && matchesFileCode && matchesCurrency;
      });

      // عرض النتائج في الجدول
      const tableBody = document.getElementById('resultsTableBody');
      const resultsContainer = document.getElementById('resultsContainer');
      const noResults = document.getElementById('noResults');

      tableBody.innerHTML = '';

      if (filteredResults.length > 0) {
        filteredResults.forEach((item, index) => {
          const row = `
            <tr class="hover:bg-gray-50 border-b border-gray-200">
              <td class="p-3 border border-gray-200">${index + 1}</td>
              <td class="p-3 border border-gray-200 font-semibold text-gray-800">${item.supplier}</td>
              <td class="p-3 border border-gray-200">${item.fileCode}</td>
              <td class="p-3 border border-gray-200">${item.currency}</td>
              <td class="p-3 border border-gray-200">${item.amount}</td>
              <td class="p-3 border border-gray-200">
                <span class="px-2 py-1 text-xs rounded-full ${getStatusStyle(item.status)}">
                  ${item.status}
                </span>
              </td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });

        resultsContainer.classList.remove('hidden');
        noResults.classList.add('hidden');
      } else {
        resultsContainer.classList.add('hidden');
        noResults.classList.remove('hidden');
      }
    }

    function resetSearch() {
      document.getElementById('supplier').value = '';
      document.getElementById('fileCode').value = '';
      document.getElementById('currency').value = '';
      document.getElementById('resultsContainer').classList.add('hidden');
      document.getElementById('noResults').classList.add('hidden');
    }

    function getStatusStyle(status) {
      switch (status) {
        case 'مكتمل': return 'bg-green-100 text-green-700';
        case 'قيد المعالجة': return 'bg-yellow-100 text-yellow-700';
        case 'معلق': return 'bg-red-100 text-red-700';
        default: return 'bg-gray-100 text-gray-700';
      }
    }
  </script>
</body>
</html>

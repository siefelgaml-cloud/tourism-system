<!-- فرعي 2: عرض كشف الحساب التفصيلي -->
<div id="creditRecordsSubTab" class="sub-tab-content">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
    <h3>سجل حركة أرصدة الكريديت بالتفصيل</h3>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="searchCredit" placeholder="🔍 بحث باسم الجهة أو رقم الملف..." onkeyup="filterCreditTable()" style="max-width: 250px;">
      <button class="excel-btn" onclick="exportCreditToExcel()">📊 تصدير السجل لـ Excel</button>
    </div>
  </div>

  <!-- بطاقات الإجمالي والملخص -->
  <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
    <div style="flex: 1; min-width: 180px; background: #dcfce7; border: 1px solid #86efac; padding: 12px 16px; border-radius: 8px;">
      <span style="font-size: 13px; color: #166534; font-weight: bold; display: block;">إجمالي الإيداعات (لنا):</span>
      <span id="totalDepositCard" style="font-size: 18px; font-weight: bold; color: #15803d;">0</span>
    </div>
    <div style="flex: 1; min-width: 180px; background: #fee2e2; border: 1px solid #fca5a5; padding: 12px 16px; border-radius: 8px;">
      <span style="font-size: 13px; color: #991b1b; font-weight: bold; display: block;">إجمالي الخصومات (علينا):</span>
      <span id="totalDeductionCard" style="font-size: 18px; font-weight: bold; color: #b91c1c;">0</span>
    </div>
    <div style="flex: 1; min-width: 180px; background: #e0f2fe; border: 1px solid #7dd3fc; padding: 12px 16px; border-radius: 8px;">
      <span style="font-size: 13px; color: #075985; font-weight: bold; display: block;">صافي الرصيد:</span>
      <span id="netBalanceCard" style="font-size: 18px; font-weight: bold; color: #0369a1;">0</span>
    </div>
  </div>

  <table id="creditTable">
    <thead>
      <tr>
        <th>#</th>
        <th>الجهة</th>
        <th>رقم الملف</th>
        <th>تاريخ الوصول</th>
        <th>تاريخ المغادرة</th>
        <th>نوع الحركة</th>
        <th>المبلغ</th>
        <th>العملة</th>
        <th>البيان / التفاصيل</th>
        <th>تاريخ التسجيل</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="creditTableBody">
      <tr>
        <td colspan="11" style="text-align: center; color: #64748b;">جاري تحميل سجل الكريديت من Firebase...</td>
      </tr>
    </tbody>
  </table>
</div>

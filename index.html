<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة التصفية والطلبات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      background-color: #f4f6f9;
      min-height: 100vh;
    }

    /* منطقة المحتوى الرئيسي (على اليمين) */
    .main-content {
      flex: 1;
      padding: 30px;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn-submit {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    /* القائمة الجانبية الرأسية (على اليسار) */
    .sidebar-left {
      width: 260px;
      background-color: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px 10px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.1);
    }

    .sidebar-left h3 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 18px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .sidebar-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-nav li a {
      display: block;
      padding: 12px 15px;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .sidebar-nav li a:hover, 
    .sidebar-nav li a.active {
      background-color: #2563eb;
      color: #ffffff;
    }

    .badge {
      background-color: #ef4444;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      float: left;
    }
  </style>
</head>
<body>

  <!-- المحتوى الرئيسي (عرض نموذج التصفية) -->
  <main class="main-content">
    <div class="card">
      <h2>عرض تصفية المرشد</h2>
      
      <form>
        <div class="row">
          <div class="form-group">
            <label>اسم المرشد/المشرف:</label>
            <input type="text" value="أحمد محمود" readonly>
          </div>
          <div class="form-group">
            <label>تاريخ التصفية:</label>
            <input type="date" value="2026-07-31">
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>إجمالي المستحقات (ج.م):</label>
            <input type="number" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>إجمالي الخصومات / العهد (ج.م):</label>
            <input type="number" placeholder="0.00">
          </div>
        </div>

        <div class="form-group">
          <label>حالة العهد المستلمة:</label>
          <select>
            <option>تم تسليم جميع العهد بحالة جيدة</option>
            <option>يوجد عهدة تالفة (تخصم من المستحق)</option>
            <option>يوجد عهدة مفقودة</option>
          </select>
        </div>

        <div class="form-group">
          <label>ملاحظات المرشد والتوصيات:</label>
          <textarea rows="3" placeholder="أدخل أي ملاحظات إضافية تخص التصفية..."></textarea>
        </div>

        <button type="button" class="btn-submit">اعتماد وعرض التصفية النهائية</button>
      </form>
    </div>
  </main>

  <!-- القائمة الجانبية الرأسية في اليسار -->
  <aside class="sidebar-left">
    <h3>القائمة السريعة</h3>
    <ul class="sidebar-nav">
      <li>
        <a href="#" class="active">
          تصفية المرشد
        </a>
      </li>
      <li>
        <a href="#">
          استلام الطلبات
          <span class="badge">5</span>
        </a>
      </li>
      <li>
        <a href="#">
          الأرشيف
        </a>
      </li>
    </ul>
  </aside>

</body>
</html>

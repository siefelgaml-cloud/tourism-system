<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التصفيات والمراجعة</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #1e293b;
            --accent-color: #0f172a;
            --text-color: #334155;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --danger-color: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e2e8f0;
            color: var(--primary-color);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .section { display: none; }
        .section.active { display: block; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button.btn-submit {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        .card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            background: #eab308;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('form')">📄 نموذج التصفية</button>
        <button class="tab-btn" onclick="switchTab('review')">🔒 مراجعة الطلبات</button>
    </div>

    <!-- قسم إدخال التصفية -->
    <div id="section-form" class="section active">
        <h2>إدخال تصفية جديدة</h2>
        <form id="settlementForm">
            <div class="form-group">
                <label>اسم المرشد / المندوب:</label>
                <input type="text" id="guideName" required placeholder="أدخل الاسم">
            </div>
            <div class="form-group">
                <label>تفاصيل التصفية / البيان:</label>
                <textarea id="details" rows="3" required placeholder="أدخل المصروفات أو الإيرادات..."></textarea>
            </div>
            <div class="form-group">
                <label>المبلغ الإجمالي (EGP):</label>
                <input type="number" id="amount" required placeholder="0.00">
            </div>
            <button type="button" class="btn-submit" onclick="submitSettlement()">إرسال التصفية للمراجعة 📤</button>
        </form>
    </div>

    <!-- قسم المراجعة -->
    <div id="section-review" class="section">
        <h2>قائمة الطلبات للمراجعة</h2>
        <div id="pinBox">
            <p>أدخل الرقم السري للوصول للطلبات:</p>
            <input type="password" id="pinInput" placeholder="****">
            <button class="btn-submit" style="margin-top:10px;" onclick="verifyPin()">دخول</button>
        </div>
        <div id="requestsList" style="display:none; margin-top:20px;">
            <button onclick="loadRequests()" style="margin-bottom:15px; padding:8px 12px; cursor:pointer;">🔄 تحديث البيانات</button>
            <div id="cardsContainer">جاري التحميل...</div>
        </div>
    </div>
</div>

<script>
    const SECRET_PIN = "991997";
    const API_URL = "https://api.jsonbin.io/v3/b/65e9f8a1dc7461202e88a001";
    const MASTER_KEY = "$2a$10$C8.c4a2A0N.7Yn.y5o.kce0QJ/vH5.k8/6d/sX.a5d1a5d1a5d1a";

    // التنقل بين التبويبات
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        
        if(tab === 'form') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('section-form').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('section-review').classList.add('active');
        }
    }

    // إرسال البيانات للستورج السحابي
    async function sendDataToCloud(data) {
        try {
            let res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(data)
            });
            return res.ok;
        } catch(e) { 
            console.error(e);
            return false; 
        }
    }

    // جلب البيانات من السحابة
    async function loadDataFromCloud() {
        try {
            let res = await fetch(`${API_URL}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            let data = await res.json();
            return data.record || { pending: [] };
        } catch(e) {
            console.error(e);
            return { pending: [] };
        }
    }

    // زر الإرسال
    async function submitSettlement() {
        const guideName = document.getElementById('guideName').value.trim();
        const details = document.getElementById('details').value.trim();
        const amount = document.getElementById('amount').value.trim();

        if(!guideName || !amount) {
            alert("يرجى ملء كافة البيانات المطلوبة!");
            return;
        }

        const newEntry = {
            id: Date.now(),
            guideName: guideName,
            details: details,
            amount: amount,
            date: new Date().toLocaleString('ar-EG')
        };

        // جلب القديم وإضافة الجديد عليه
        let currentData = await loadDataFromCloud();
        if (!currentData.pending) currentData.pending = [];
        currentData.pending.push(newEntry);

        let success = await sendDataToCloud(currentData);
        if(success) {
            alert("✅ تم إرسال التصفية بنجاح إلى قائمة المراجعة!");
            document.getElementById('settlementForm').reset();
        } else {
            alert("❌ حدث خطأ أثناء الإرسال، برجاء المحاولة لاحقاً.");
        }
    }

    // التحقق من PIN
    function verifyPin() {
        const pin = document.getElementById('pinInput').value;
        if(pin === SECRET_PIN) {
            document.getElementById('pinBox').style.display = 'none';
            document.getElementById('requestsList').style.display = 'block';
            loadRequests();
        } else {
            alert("الرقم السري غير صحيح!");
        }
    }

    // عرض الطلبات
    async function loadRequests() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = "جاري تحميل الطلبات...";
        
        let data = await loadDataFromCloud();
        let list = data.pending || [];

        if(list.length === 0) {
            container.innerHTML = "<p>لا توجد طلبات معلقة حالياً.</p>";
            return;
        }

        let html = "";
        list.reverse().forEach(item => {
            html += `
                <div class="card">
                    <span class="status-badge">قيد المراجعة</span>
                    <h4>المرشد: ${item.guideName}</h4>
                    <p><strong>التفاصيل:</strong> ${item.details}</p>
                    <p><strong>المبلغ:</strong> ${item.amount} EGP</p>
                    <small>التاريخ: ${item.date}</small>
                </div>
            `;
        });
        container.innerHTML = html;
    }
</script>
</body>
</html>

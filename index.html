<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كشف حساب الموردين - قسم الكريديت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 p-6">

  <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-md p-6">
    
    <!-- Header Section -->
    <div class="flex flex-wrap justify-between items-center pb-4 mb-4 border-b gap-4">
      
      <!-- Right Side: Title / Search Trigger -->
      <div class="flex items-center space-x-2 space-x-reverse">
        <button id="toggleFilterBtn" class="text-xl font-bold text-gray-800 hover:text-blue-600 transition flex items-center gap-2">
          <span>كشف حساب المورد:</span>
          <span id="selectedSupplierText" class="text-blue-600">اختر المورد...</span>
          <i class="fa-solid me-2 fa-chevron-down text-sm text-gray-500"></i>
        </button>
      </div>

      <!-- Left Side: Actions -->
      <div class="flex items-center gap-2">
        <button class="bg-slate-600 text-white px-4 py-2 rounded hover:bg-slate-700 transition text-sm flex items-center gap-2">
          <i class="fa-solid fa-print"></i>
          طباعة كشف الحساب
        </button>
        <button class="bg-slate-500 text-white px-4 py-2 rounded hover:bg-slate-600 transition text-sm">
          إغلاق
        </button>
      </div>
    </div>

    <!-- Dropdown Filter Section (Popup / Collapsible Panel) -->
    <div id="filterMenu" class="bg-slate-50 border border-slate-200 p-4 rounded-lg mb-6 shadow-inner hidden">
      <h3 class="text-sm font-semibold text-gray-700 mb-3 border-b pb-2">البحث وتحديد كشف الحساب</h3>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        
        <!-- Search by Supplier Name -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">اسم المورد</label>
          <input type="text" id="supplierSearch" placeholder="ابحث باسم المورد..." class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Search by File Number -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">رقم الملف</label>
          <input type="text" id="fileNumSearch" placeholder="ادخل رقم الملف..." class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Currency Dropdown -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">العملة</label>
          <select id="currencySelect" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="USD">USD - دولار أمريكي</option>
            <option value="EGP">EGP - جنيه مصري</option>
            <option value="EUR">EUR - يورو</option>
            <option value="SAR">SAR - ريال سعودي</option>
          </select>
        </div>

        <!-- Apply Filter Button -->
        <div class="flex items-end">
          <button id="applyFilterBtn" class="w-full bg-blue-600 text-white py-1.5 px-4 rounded text-sm hover:bg-blue-700 transition flex justify-center items-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i>
            عرض كشف الحساب
          </button>
        </div>

      </div>
    </div>

    <!-- Table Section -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-right border-collapse border border-gray-200">
        <thead class="bg-gray-50 text-gray-700">
          <tr>
            <th class="border border-gray-200 px-4 py-2 font-semibold">التاريخ</th>
            <th class="border border-gray-200 px-4 py-2 font-semibold">البيان</th>
            <th class="border border-gray-200 px-4 py-2 font-semibold">رقم الملف</th>
            <th class="border border-gray-200 px-4 py-2 font-semibold">المبلغ</th>
            <th class="border border-gray-200 px-4 py-2 font-semibold">مدين</th>
            <th class="border border-gray-200 px-4 py-2 font-semibold">دائن</th>
            <th class="border border-gray-200 px-4 py-2 font-semibold">الرصيد (مدين/دائن)</th>
          </tr>
        </thead>
        <tbody id="statementTableBody" class="divide-y divide-gray-200">
          <!-- Dynamic / Sample Rows -->
          <tr class="hover:bg-gray-50">
            <td class="border border-gray-200 px-4 py-2">2026-08-01</td>
            <td class="border border-gray-200 px-4 py-2">رصيد افتتاحى</td>
            <td class="border border-gray-200 px-4 py-2">-</td>
            <td class="border border-gray-200 px-4 py-2">0.00</td>
            <td class="border border-gray-200 px-4 py-2">0.00</td>
            <td class="border border-gray-200 px-4 py-2">0.00</td>
            <td class="border border-gray-200 px-4 py-2 font-semibold text-gray-700">0.00</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const toggleBtn = document.getElementById('toggleFilterBtn');
    const filterMenu = document.getElementById('filterMenu');
    const applyBtn = document.getElementById('applyFilterBtn');
    const selectedSupplierText = document.getElementById('selectedSupplierText');

    // Toggle menu view
    toggleBtn.addEventListener('click', () => {
      filterMenu.classList.toggle('hidden');
    });

    // Handle filter application
    applyBtn.addEventListener('click', () => {
      const supplier = document.getElementById('supplierSearch').value || 'Sonesta San George Hotel';
      const currency = document.getElementById('currencySelect').value;
      
      // Update header label
      selectedSupplierText.innerText = `${supplier} (${currency})`;
      
      // Hide filter panel after selection
      filterMenu.classList.add('hidden');
    });
  </script>

</body>
</html>
